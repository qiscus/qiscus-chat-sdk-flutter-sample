name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.6
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=QISCUS_APP_ID=sample

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.6
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --dart-define=QISCUS_APP_ID=sample

name: qiscus_chat_flutter_sample
description: Comprehensive Qiscus Chat SDK Integration Example
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Qiscus Chat SDK
  qiscus_chat_sdk: ^2.2.4
  
  # State Management
  provider: ^6.0.5
  
  # UI Components
  cached_network_image: ^3.2.3
  image_picker: ^1.0.4
  file_picker: ^9.0.0
  
  # Utilities
  intl: ^0.18.1
  
  # Firebase (optional at runtime - enable with ENABLE_FIREBASE_PUSH)
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.9

# dependency_overrides:
#   qiscus_chat_sdk:
#     path: ../qiscus-chat-sdk-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
